name: Deploy Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'mkdocs.yml']
  workflow_dispatch:

# mkdocs gh-deploy pushes to the gh-pages branch (Pages uses the legacy
# branch source), which needs only contents: write
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-minify-plugin

      - name: Build and deploy
        run: mkdocs gh-deploy --force
